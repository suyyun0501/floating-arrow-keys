name: Build FloatingArrowKeys APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle 

      # ── 3. Install Gradle 8.2 (compatible with Android Gradle Plugin 8.2.0) ──
      - name: Set up Gradle 8.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2/bin" >> "$GITHUB_PATH"

      # ── 4. Build debug APK ────────────────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # ── 5. Upload APK as artifact ─────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingArrowKeys-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Optional: Build release APK (unsigned, for sideloading) ──
      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingArrowKeys-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
